# Builds the installers for every platform when a version tag is pushed (scripts/release.mjs does that),
# checks that each packaged app starts, and hands the files to the release script as artifacts.
# Nothing is published from here: the maintainer's release script downloads these and creates the release.
#
# Signing is automatic once its secrets exist (see SIGNING.md):
#   macOS:   MAC_SELF_SIGNED_P12_BASE64, MAC_SELF_SIGNED_PASSWORD (same certificate as 1.20.0)
#   Windows: AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET, AZURE_SIGNING_ENDPOINT, AZURE_SIGNING_ACCOUNT,
#            AZURE_SIGNING_PROFILE, AZURE_SIGNING_PUBLISHER
#   Linux:   APT_SIGNING_KEY (signs the apt repository published with each release)
# macOS requires a persistent certificate; Windows builds can be unsigned.
name: Release build

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name == 'push' && github.ref_type == 'tag' && !github.event.deleted
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify release tag
        shell: bash
        run: |
          set -eu
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$GITHUB_REF_NAME" = "v$(node --print 'require("./package.json").version')"
          git merge-base --is-ancestor HEAD refs/remotes/origin/main

  windows:
    needs: verify
    environment: release-windows
    runs-on: windows-latest
    steps:
      - &checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - &setup-node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - &install
        run: npm ci
      - &build
        run: npm run build
      - name: Package Windows
        shell: bash
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ secrets.AZURE_SIGNING_PROFILE }}
          AZURE_SIGNING_PUBLISHER: ${{ secrets.AZURE_SIGNING_PUBLISHER }}
        run: |
          extra=()
          if [ -n "$AZURE_CLIENT_SECRET" ]; then
            echo "Signing with Azure Trusted Signing"
            extra+=(-c.win.azureSignOptions.endpoint="$AZURE_SIGNING_ENDPOINT"
              -c.win.azureSignOptions.codeSigningAccountName="$AZURE_SIGNING_ACCOUNT"
              -c.win.azureSignOptions.certificateProfileName="$AZURE_SIGNING_PROFILE"
              -c.win.azureSignOptions.publisherName="$AZURE_SIGNING_PUBLISHER")
          fi
          npx electron-builder --win nsis portable "${extra[@]}" --publish never
      - name: Previous app cannot reopen during a Windows update
        shell: pwsh
        run: |
          $nsis = node -e "require('app-builder-lib/out/toolsets/windows').getMakeNsisPath().then(x => console.log(JSON.stringify(x)))" | ConvertFrom-Json
          $env:NSISDIR = $nsis.env.NSISDIR
          $fixture = Join-Path $env:RUNNER_TEMP "test-windows-update.exe"
          & $nsis.path /V2 "/DOUTFILE=$fixture" scripts/test-windows-update.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $test = Start-Process -FilePath $fixture -ArgumentList /S -WindowStyle Hidden -Wait -PassThru
          exit $test.ExitCode
      - name: Packaged app starts (Windows)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "release/win-unpacked/Doko.exe" -PassThru
          Start-Sleep -Seconds 20
          if ($p.HasExited) { throw "Doko exited with code $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force
      - uses: actions/upload-artifact@v7
        with:
          name: doko-windows
          overwrite: true
          if-no-files-found: error
          path: |
            release/Doko-Setup.exe
            release/Doko-Setup.exe.blockmap
            release/Doko-Portable.exe
            release/latest.yml

  macos:
    needs: verify
    environment: release-macos
    runs-on: macos-26-intel
    steps:
      - *checkout
      - *setup-node
      - *install
      - *build
      - name: Package macOS
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          MAC_SELF_SIGNED_P12_BASE64: ${{ secrets.MAC_SELF_SIGNED_P12_BASE64 }}
          MAC_SELF_SIGNED_PASSWORD: ${{ secrets.MAC_SELF_SIGNED_PASSWORD }}
          # Changing this certificate breaks updates from 1.20.0; migration needs a separate plan.
          DOKO_MAC_SIGN_IDENTITY: C1D1C0D9EC7D8B849C48DADC2F9E278B40C33919
        run: |
          : "${MAC_SELF_SIGNED_P12_BASE64:?The existing macOS signing certificate is required}" "${MAC_SELF_SIGNED_PASSWORD:?Missing certificate password}"
          export DOKO_MAC_SIGN_KEYCHAIN="$RUNNER_TEMP/doko-signing.keychain-db"
          keychain_password=$(openssl rand -hex 32)
          echo "::add-mask::$keychain_password"
          printf '%s' "$MAC_SELF_SIGNED_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/doko-signing.p12"
          security create-keychain -p "$keychain_password" "$DOKO_MAC_SIGN_KEYCHAIN"
          security set-keychain-settings -lut 21600 "$DOKO_MAC_SIGN_KEYCHAIN"
          security unlock-keychain -p "$keychain_password" "$DOKO_MAC_SIGN_KEYCHAIN"
          security import "$RUNNER_TEMP/doko-signing.p12" -k "$DOKO_MAC_SIGN_KEYCHAIN" -P "$MAC_SELF_SIGNED_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$DOKO_MAC_SIGN_KEYCHAIN" > /dev/null
          # A fresh runner must trust this self-signed root before codesign can use its identity.
          security find-certificate -p "$DOKO_MAC_SIGN_KEYCHAIN" > "$RUNNER_TEMP/doko-signing.crt"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k "$DOKO_MAC_SIGN_KEYCHAIN" "$RUNNER_TEMP/doko-signing.crt"
          rm "$RUNNER_TEMP/doko-signing.p12"
          npx electron-builder --mac -c.mac.identity=- -c.mac.sign=./scripts/mac-sign.cjs -c.extraMetadata.folioMacSigned=true --publish never
          codesign --verify --deep --strict -R="certificate leaf = H\"$DOKO_MAC_SIGN_IDENTITY\"" "release/mac-universal/Doko.app"
      - name: Remove temporary signing keychain
        if: always()
        run: |
          trust_status=0
          if [ -f "$RUNNER_TEMP/doko-signing.crt" ]; then
            sudo security remove-trusted-cert -d "$RUNNER_TEMP/doko-signing.crt" || trust_status=$?
            rm "$RUNNER_TEMP/doko-signing.crt"
          fi
          rm -f "$RUNNER_TEMP/doko-signing.p12"
          if [ -f "$RUNNER_TEMP/doko-signing.keychain-db" ]; then
            security delete-keychain "$RUNNER_TEMP/doko-signing.keychain-db"
          fi
          exit "$trust_status"
      - name: Packaged app starts (macOS)
        run: |
          codesign --verify --deep --verbose=2 "release/mac-universal/Doko.app"
          "release/mac-universal/Doko.app/Contents/MacOS/Doko" > app.log 2>&1 &
          pid=$!
          sleep 20
          if ! kill -0 "$pid"; then cat app.log; exit 1; fi
          kill "$pid"
      - uses: actions/upload-artifact@v7
        with:
          name: doko-macos
          overwrite: true
          if-no-files-found: error
          path: |
            release/Doko-mac.dmg
            release/Doko-mac.dmg.blockmap
            release/Doko-mac.zip
            release/Doko-mac.zip.blockmap
            release/latest-mac.yml

  linux:
    needs: verify
    environment: release-linux
    runs-on: ubuntu-latest
    steps:
      - *checkout
      - *setup-node
      - *install
      - *build
      - name: Package Linux
        run: |
          npx electron-builder --linux AppImage deb --publish never
          sudo apt-get install -y -qq dpkg-dev apt-utils > /dev/null
      - name: Signed apt repository (Linux)
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: bash scripts/apt-repo.sh
      - name: Packaged app starts (Linux)
        run: |
          xvfb-run -a release/linux-unpacked/folio-local --no-sandbox > app.log 2>&1 &
          sleep 20
          if ! pgrep -f linux-unpacked/folio-local > /dev/null; then cat app.log; exit 1; fi
          pkill -f linux-unpacked/folio-local
      - uses: actions/upload-artifact@v7
        with:
          name: doko-linux
          overwrite: true
          if-no-files-found: error
          path: |
            release/Doko-linux-x86_64.AppImage
            release/Doko-linux-amd64.deb
            release/latest-linux.yml
            release/Packages
            release/Packages.gz
            release/Release
            release/InRelease
            release/Release.gpg
