name: Mac release diagnostics
on:
  push:
    branches: [diagnostics/mac-release]
permissions:
  contents: read
jobs:
  signing-fixture:
    runs-on: macos-26-intel
    timeout-minutes: 10
    steps:
      - name: Compare isolated signing identity lookup
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          work=$(mktemp -d)
          keychain="$work/signing.keychain-db"
          cleanup() {
            security delete-keychain "$keychain" || true
            rm -rf "$work"
          }
          trap cleanup EXIT
          cat > "$work/cert.cnf" <<'EOF'
          [req]
          distinguished_name = dn
          x509_extensions = ext
          prompt = no
          [dn]
          CN = Doko CI Diagnostic Code Signing
          O = Doko CI Diagnostic
          [ext]
          basicConstraints = critical, CA:false
          keyUsage = critical, digitalSignature
          extendedKeyUsage = critical, codeSigning
          subjectKeyIdentifier = hash
          EOF
          openssl req -newkey rsa:2048 -nodes -x509 -days 1 -config "$work/cert.cnf" -keyout "$work/key.pem" -out "$work/cert.pem"
          openssl pkcs12 -export -inkey "$work/key.pem" -in "$work/cert.pem" -out "$work/cert.p12" -passout pass:fixture-password -keypbe PBE-SHA1-3DES -certpbe PBE-SHA1-3DES -macalg sha1
          security create-keychain -p fixture-password "$keychain"
          security unlock-keychain -p fixture-password "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security import "$work/cert.p12" -k "$keychain" -P fixture-password -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k fixture-password "$keychain" > /dev/null
          identity=$(openssl x509 -in "$work/cert.pem" -noout -fingerprint -sha1 | cut -d= -f2 | tr -d ':')
          cp /usr/bin/true "$work/signing-test"
          echo 'CASE A: imported identity without explicit trust or search registration'
          security find-identity -p codesigning "$keychain"
          /usr/bin/codesign --force --sign "$identity" --keychain "$keychain" --timestamp=none "$work/signing-test" && echo 'CASE A PASS' || echo 'CASE A FAIL'
          echo 'CASE B: trust only (same as release 1.20.5)'
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k "$keychain" "$work/cert.pem"
          security find-identity -p codesigning "$keychain"
          /usr/bin/codesign --force --sign "$identity" --keychain "$keychain" --timestamp=none "$work/signing-test" && echo 'CASE B PASS' || echo 'CASE B FAIL'
          echo 'CASE C: trust and registered signing keychain'
          security list-keychains -d user | xargs security list-keychains -d user -s "$keychain"
          security find-identity -p codesigning "$keychain"
          security find-identity -v -p codesigning "$keychain"
          /usr/bin/codesign --force --sign "$identity" --keychain "$keychain" --timestamp=none "$work/signing-test"
          /usr/bin/codesign --verify -R="certificate leaf = H\"$identity\"" "$work/signing-test"
          echo 'CASE C PASS'
  hidden-tabs:
    runs-on: macos-26-intel
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/smoke-test.mjs
