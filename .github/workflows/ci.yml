name: CI

on:
  push:
    branches: [main, "ci/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    # Keep the required check name while avoiding the stalled Apple Silicon runner queue.
    runs-on: ${{ matrix.os == 'macos-latest' && 'macos-26-intel' || matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: node scripts/test-electron-install.mjs
      # Everything, not --omit=dev: the libraries bundled into the app (pdf.js, KaTeX, the Markdown and OCR
      # code) and Electron itself are devDependencies here, so leaving them out audits almost nothing that ships.
      - run: bun audit --audit-level=high
      - run: bun run test:chat-math
      - run: bun run test:thumbnails
      - run: bun run test:document-state
      - run: bun run test:ipc-contract
      - run: bun run test:preferences
      - run: bun run test:ai-ended-reply
      - run: node --test scripts/test-word-files.cjs scripts/test-network-security.cjs scripts/test-release-build.mjs scripts/test-claude-path.cjs scripts/test-content-files.cjs scripts/test-content-source.mjs scripts/test-html-preview.mjs scripts/test-csv.mjs scripts/test-xlsx-files.cjs scripts/test-markdown-sections.mjs scripts/test-hidden-window.mjs scripts/test-fork-channel.mjs scripts/test-reader-page.mjs scripts/test-release-notes.cjs
      - run: node --test scripts/test-link-history.mjs
      - run: node --test scripts/test-openrouter.cjs
      - run: node scripts/test-smoke-runner.mjs
      - run: node scripts/test-build-globs.mjs
      - run: bun run build
      - name: Browser Edition link shortcuts
        run: |
          bunx playwright-core install chromium --only-shell
          node scripts/test-browser-link-shortcuts.mjs
      - name: Smoke test (Linux, virtual display)
        timeout-minutes: 20
        if: runner.os == 'Linux'
        run: |
          # Exercise the native save ACL regression instead of skipping its fixture.
          sudo apt-get update -qq
          sudo apt-get install -y acl libreoffice-writer
          # Ubuntu 24.04 restricts the user namespaces Chromium's sandbox needs; installed Doko packages
          # ship an AppArmor profile for this, but the development Electron binary doesn't.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bunx playwright-core install ffmpeg
          FOLIO_TEST_CONVERTER=builtin xvfb-run -a bun run test:reader-security
          FOLIO_TEST_CONVERTER=libreoffice xvfb-run -a node scripts/smoke-word-network.mjs
          FOLIO_PRINT_VIDEO=1 FOLIO_LINK_VIDEO=1 FOLIO_TEST_CONVERTER=builtin xvfb-run -a bun run smoke
      - name: Reader security regressions
        if: runner.os != 'Linux'
        env:
          FOLIO_TEST_CLIENT_IDENTITY: ${{ runner.os == 'Windows' && '1' || '0' }}
        run: bun run test:reader-security
      - name: Smoke test
        timeout-minutes: 20
        if: runner.os != 'Linux'
        run: bun run smoke
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smoke-${{ matrix.os }}
          path: release/smoke/
          if-no-files-found: ignore
