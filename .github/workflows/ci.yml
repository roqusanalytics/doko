name: CI

on:
  push:
    branches: [main, "ci/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Everything, not --omit=dev: the libraries bundled into the app (pdf.js, KaTeX, the Markdown and OCR
      # code) and Electron itself are devDependencies here, so leaving them out audits almost nothing that ships.
      - run: npm audit --audit-level=high
      - run: npm run test:chat-math
      - run: npm run test:thumbnails
      - name: Diagnose Windows save permissions
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $root = Join-Path $env:RUNNER_TEMP ([Guid]::NewGuid().ToString())
          New-Item -ItemType Directory -Path $root | Out-Null
          $env:FOLIO_SAVE_SOURCE = Join-Path $root 'source.md'
          $stageDir = Join-Path $root 'stage'
          New-Item -ItemType Directory -Path $stageDir | Out-Null
          $env:FOLIO_SAVE_TEMP = Join-Path $stageDir 'save.tmp'
          [IO.File]::WriteAllText($env:FOLIO_SAVE_SOURCE, 'original')
          [IO.File]::WriteAllText($env:FOLIO_SAVE_TEMP, '')
          $source = Get-Content electron/save-metadata.cjs -Raw
          $code = [regex]::Match($source, 'const WINDOWS_ACCESS = `([\s\S]+?)`;').Groups[1].Value
          try { Invoke-Expression $code }
          catch {
            $_ | Format-List * -Force
            Get-Acl -LiteralPath $env:FOLIO_SAVE_SOURCE | Format-List Sddl
            Get-Acl -LiteralPath $env:FOLIO_SAVE_TEMP | Format-List Sddl
            throw
          } finally { Remove-Item -LiteralPath $root -Recurse -Force }
      - run: node --test scripts/test-word-files.cjs scripts/test-network-security.cjs scripts/test-release-build.mjs scripts/test-claude-path.cjs scripts/test-content-files.cjs scripts/test-content-source.mjs scripts/test-markdown-sections.mjs scripts/test-hidden-window.mjs scripts/test-fork-channel.mjs
      - run: node --test scripts/test-link-history.mjs
      - run: node --test scripts/test-openrouter.cjs
      - run: npm run build
      - name: Browser Edition link shortcuts
        run: |
          npx --no-install playwright-core install chromium --only-shell
          node scripts/test-browser-link-shortcuts.mjs
      - name: Smoke test (Linux, virtual display)
        if: runner.os == 'Linux'
        run: |
          # Exercise the native save ACL regression instead of skipping its fixture.
          sudo apt-get update -qq
          sudo apt-get install -y acl
          # Ubuntu 24.04 restricts the user namespaces Chromium's sandbox needs; installed Folio packages
          # ship an AppArmor profile for this, but the development Electron binary doesn't.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          npx --no-install playwright-core install ffmpeg
          xvfb-run -a npm run test:reader-security
          FOLIO_PRINT_VIDEO=1 FOLIO_LINK_VIDEO=1 xvfb-run -a npm run smoke
      - name: Reader security regressions
        if: runner.os != 'Linux'
        env:
          FOLIO_TEST_CLIENT_IDENTITY: ${{ runner.os == 'Windows' && '1' || '0' }}
        run: npm run test:reader-security
      - name: Smoke test
        if: runner.os != 'Linux'
        run: npm run smoke
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smoke-${{ matrix.os }}
          path: release/smoke/
          if-no-files-found: ignore
